version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-jagin_ai}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@jagin.ai}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # web:
  #   build:
  #     context: ../
  #     dockerfile: docker/Dockerfile.web
  #   ports:
  #     - "3000:3000"

  # api:
  #   build:
  #     context: ../
  #     dockerfile: docker/Dockerfile.api
  #   ports:
  #     - "4000:4000"

  # worker:
  #   build:
  #     context: ../
  #     dockerfile: docker/Dockerfile.worker

volumes:
  pgdata:
  redisdata:
